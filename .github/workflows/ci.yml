name: NEXORA Automated CI/CD Pipeline

on:
  push:
    branches:
      - main
      - adarsh-work
      - dhanushya-v2
      - 'feature/**'
  pull_request:
    branches:
      - main
      - adarsh-work
      - dhanushya-v2

jobs:
  test-and-verify:
    name: Run Pytest Suite & Architecture Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize & Seed Database
        run: |
          python seed.py

      - name: Run Automated Pytest Test Suite
        run: |
          python -m pytest tests/ -v --tb=short
